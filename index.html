<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domo · Calidad de Limpieza</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         background: #f9f9f6; color: #2c2c2a; margin: 0; padding: 24px;
         font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 500; }
  h2 { margin: 0 0 12px; font-size: 16px; font-weight: 500; }
  .sub { color: #666; font-size: 13px; margin: 0 0 24px; }
  .card { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px;
          padding: 16px 20px; margin-bottom: 20px; }
  .card.alert { border-left: 3px solid #A32D2D; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 8px; font-size: 11px;
          font-weight: 500; margin-right: 6px; }
  .pill-red { background:#FCEBEB; color:#791F1F; }
  .pill-amber { background:#FAEEDA; color:#633806; }
  .pill-green { background:#EAF3DE; color:#27500A; }
  .pill-blue { background:#E6F1FB; color:#0C447C; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align:left; font-weight:500; font-size:12px; color:#666;
       background:#f1efe8; padding:10px 12px; }
  td { padding: 12px; border-top: 0.5px solid rgba(0,0,0,0.08); vertical-align: top; }
  tr.qc-trigger { background: rgba(163,45,45,0.04); }
  .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .feed-item { padding: 6px 0; font-size: 13px;
               border-top: 0.5px solid rgba(0,0,0,0.08); }
  .feed-item:first-child { border-top: 0; }
  .feed-flex { display: flex; justify-content: space-between; gap: 12px; }
  .small { font-size: 11px; color: #999; }
  .score-good { color: #27500A; font-weight: 500; }
  .score-warn { color: #BA7517; font-weight: 500; }
  .score-bad { color: #A32D2D; font-weight: 500; }
  ol { margin: 0; padding-left: 20px; }
  li { margin: 6px 0; }
  #loading { padding: 40px; text-align: center; color: #666; }
  .err { color: #A32D2D; padding: 16px; background:#FCEBEB; border-radius:8px; }
  .reload-btn { font-size: 12px; padding: 4px 10px; border:0.5px solid rgba(0,0,0,0.2);
                background:#fff; border-radius:6px; cursor:pointer; }
  .reload-btn:hover { background:#f1efe8; }
  .meta { display:flex; justify-content:space-between; align-items:baseline;
          margin-bottom:4px; }
  .sc-row td { font-size:13px; }
  .sc-total { font-weight:500; padding: 3px 10px; border-radius: 6px; display:inline-block; min-width: 48px; text-align:center; }
  .sc-90 { background:#EAF3DE; color:#27500A; }
  .sc-80 { background:#F4FBE5; color:#3B6D11; }
  .sc-70 { background:#FAEEDA; color:#633806; }
  .sc-60 { background:#FAE5CD; color:#854F0B; }
  .sc-low { background:#FCEBEB; color:#791F1F; }
  .sc-rank { color: #999; font-weight:400; width: 28px; text-align:right; padding-right:8px; }
  .sc-elig-y { color: #27500A; }
  .sc-elig-n { color: #A32D2D; }
  .legend { font-size:11px; color:#666; padding-top:8px; line-height:1.6; }
  details { font-size: 12px; }
  details summary { cursor: pointer; color: #888; padding: 4px 0; }
  details[open] summary { color: #444; }
</style>
</head>
<body>
<div class="wrap">
  <div class="meta">
    <h1>Calidad de limpieza · pulso diario</h1>
    <div><button class="reload-btn" onclick="load()">Recargar</button></div>
  </div>
  <p class="sub">Para Janet y Jenny · Lee de Supabase <code>cleaning_inspections_cache</code> · <span id="last-update"></span></p>
  <div id="loading">Cargando datos...</div>
  <div id="content" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dowkxvpdpqqaufjqcjmp.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvd2t4dnBkcHFxYXVmanFjam1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1Mjg0ODgsImV4cCI6MjA4NzEwNDQ4OH0.dK130-ltr_0xJH79ASQ7DQ0ClF9ZptL8BQ50jQ9eq3E';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const CLEANER_ROSTER = new Set([
  'Jenny Guilamo','Mirsa Heredia Rivera','Myriam Fuentes','Kyraisha Melendez',
  'Marimat Ayala','Ovalesca Falette Cosme','Ruth Quintero','Marianis Muñoz',
  'Jannymar Ayala','Norma Rodríguez','Joanny Rivera',
  'Saturnina Alfonso','Clara Almonte','Emma Rodriguez'
]);
const cleanProviderName = (n) => n ? n.replace(/^\d+:\s*/, '').trim() : n;
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const daysAgo = n => { const d = new Date(TODAY); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const dParse = s => new Date(s+'T00:00:00');
const fmtMonth = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtDate = s => { const d = dParse(s); return d.getDate()+' '+fmtMonth[d.getMonth()]; };
const escapeHtml = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const scoreClass = s => s === null || s === undefined ? '' : s >= 4.5 ? 'score-good' : s >= 4.0 ? 'score-warn' : 'score-bad';

async function load() {
  document.getElementById('loading').hidden = false;
  document.getElementById('loading').textContent = 'Cargando datos...';
  document.getElementById('content').hidden = true;

  const since = daysAgo(90);
  const { data, error } = await sb
    .from('cleaning_inspections_cache')
    .select('*')
    .gte('service_date', since)
    .order('service_date', { ascending: false });

  if (error) {
    document.getElementById('loading').innerHTML = '<div class="err">Error: '+escapeHtml(error.message)+'</div>';
    return;
  }

  // Also fetch BK ratings from service_history for the Scorecard
  const { data: shData, error: shErr } = await sb
    .from('service_history')
    .select('provider_team, rating_value')
    .gt('rating_value', 0);
  window.__bkPerCleaner = {};
  if (!shErr && shData) {
    shData.forEach(r => {
      if (!r.provider_team) return;
      const name = cleanProviderName(r.provider_team);
      if (!CLEANER_ROSTER.has(name)) return;
      if (!window.__bkPerCleaner[name]) window.__bkPerCleaner[name] = { sum:0, count:0 };
      window.__bkPerCleaner[name].sum += r.rating_value;
      window.__bkPerCleaner[name].count++;
    });
  }

  render(data);
  document.getElementById('last-update').textContent = 'Actualizado: ' + new Date().toLocaleString('es-PR');
}

function statusFor(events) {
  const n = events.length;
  if (n === 0) return { label:'OK', cls:'pill-green' };
  if (n >= 4) return { label:'Revisión QC', cls:'pill-red' };
  if (n >= 3) {
    const sorted = [...events].sort((a,b) => b.service_date.localeCompare(a.service_date));
    if ((sorted[0].score ?? 0) >= 4.5) return { label:'Recuperándose', cls:'pill-amber' };
    return { label:'Monitor', cls:'pill-amber' };
  }
  if (n >= 2) return { label:'Monitor', cls:'pill-amber' };
  return { label:'OK', cls:'pill-green' };
}

function sparkline(scores) {
  if (!scores.length) return '<svg width="100" height="22"></svg>';
  if (scores.length === 1) {
    const y = 22 - ((scores[0]-3)/2)*18;
    return `<svg width="100" height="22"><line x1="4" y1="14" x2="92" y2="14" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="2,2"/><circle cx="92" cy="${y}" r="3" fill="#3B6D11"/></svg>`;
  }
  const w = 96, h = 22;
  const xs = scores.map((_, i) => 4 + (i / (scores.length-1)) * (w-4));
  const ys = scores.map(s => h - 4 - ((s-3)/2) * (h-8));
  const pts = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const last = scores[scores.length-1];
  const trend = scores[scores.length-1] - scores[0];
  const color = trend > 0.3 ? '#3B6D11' : trend < -0.3 ? '#A32D2D' : '#888780';
  return `<svg width="${w+4}" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/><circle cx="${xs[xs.length-1].toFixed(1)}" cy="${ys[ys.length-1].toFixed(1)}" r="3" fill="${color}"/></svg>`;
}

function render(allRows) {
  // Cleaner self-checklists are NOT QC events — exclude them from heat board, scorecard, feeds.
  // Jenny's supervisor checklist is the QC signal.
  const rows = allRows.filter(r => r.checklist_template !== 'Checklist Limpiadora');
  const cutoff60 = daysAgo(60);
  const cutoff30 = daysAgo(30);
  const cutoff7 = daysAgo(7);

  // Group by cleaner — last 60d, only attributable rows
  const byCleaner = {};
  rows.filter(r => r.cleaner_name && r.service_date >= cutoff60).forEach(r => {
    const c = byCleaner[r.cleaner_name] = byCleaner[r.cleaner_name] || { events: [] };
    c.events.push(r);
  });

  // Sort cleaners by event count desc, then by latest service date
  const cleaners = Object.entries(byCleaner).map(([name, c]) => {
    const sorted = [...c.events].sort((a,b) => a.service_date.localeCompare(b.service_date));
    const latest = sorted[sorted.length-1];
    const sevCounts = {};
    c.events.forEach(e => { if (e.severity) sevCounts[e.severity] = (sevCounts[e.severity]||0) + 1; });
    const sev = ['S1','S2','S3','S4'].filter(k => sevCounts[k]).map(k => `${k} ×${sevCounts[k]}`).join(' · ');
    const scoresWithDates = sorted.filter(e => e.score !== null && e.service_date >= cutoff30).map(e => e.score);
    return {
      name, count: c.events.length, lastScore: latest.score, lastDate: latest.service_date,
      lastProp: latest.property_name, sev, scores: scoresWithDates,
      ...statusFor(c.events)
    };
  }).sort((a,b) => b.count - a.count || b.lastDate.localeCompare(a.lastDate));

  // === Today's focus ===
  const focus = [];
  const triggered = cleaners.filter(c => c.count >= 3 && c.label !== 'Recuperándose');
  triggered.forEach(c => focus.push({ pill:'pill-red', tag:'Revisión QC', text:`${c.name} — ${c.count} eventos en 60d → coaching 1:1 obligatorio` }));
  const recovering = cleaners.filter(c => c.label === 'Recuperándose');
  recovering.forEach(c => focus.push({ pill:'pill-green', tag:'Reconocer', text:`${c.name} — score ${c.lastScore} en última inspección, recuperación visible` }));
  if (triggered.length) focus.push({ pill:'pill-amber', tag:'Acompañar', text:`Jenny acompaña a ${triggered[0].name} en su próxima limpieza WI` });

  // === Recent catches (last 7d, score < 5 OR has severity) ===
  const recent = rows.filter(r => r.service_date >= cutoff7 && r.cleaner_name)
                     .sort((a,b) => b.service_date.localeCompare(a.service_date));

  // === Property hot list (last 30d) ===
  const propMap = {};
  rows.filter(r => r.property_name && r.service_date >= cutoff30 && r.severity)
      .forEach(r => {
        const p = propMap[r.property_name] = propMap[r.property_name] || { name:r.property_name, count:0, last:null, sevs:[] };
        p.count++;
        if (!p.last || r.service_date > p.last) p.last = r.service_date;
        p.sevs.push({ sev:r.severity, date:r.service_date });
      });
  const props = Object.values(propMap).sort((a,b) => b.count - a.count || b.last.localeCompare(a.last)).slice(0, 6);

  // === Build HTML ===
  let html = '';

  if (focus.length) {
    html += `<div class="card alert">
      <h2>Foco de esta semana</h2>
      <div class="small" style="margin-bottom:8px">${triggered.length} limpiadora${triggered.length===1?'':'s'} requiere${triggered.length===1?'':'n'} atención · ${recovering.length} merece${recovering.length===1?'':'n'} reconocimiento</div>
      <ol>${focus.map(f => `<li><span class="pill ${f.pill}">${f.tag}</span>${escapeHtml(f.text)}</li>`).join('')}</ol>
    </div>`;
  }

  html += `<div class="card">
    <h2>Panel de calor · limpiadoras (últimos 60 días)</h2>
    <table><thead><tr>
      <th>Limpiadora</th><th>Estado</th><th>60d</th><th>Tendencia (30d)</th><th>Última</th>
    </tr></thead><tbody>`;
  cleaners.forEach(c => {
    const isQC = c.label === 'Revisión QC';
    html += `<tr class="${isQC?'qc-trigger':''}">
      <td><div style="font-weight:500">${escapeHtml(c.name)}</div><div class="small">${escapeHtml(c.sev)}</div></td>
      <td><span class="pill ${c.cls}">${c.label}</span></td>
      <td style="text-align:center;font-weight:500">${c.count}</td>
      <td>${sparkline(c.scores)}</td>
      <td><div class="${scoreClass(c.lastScore)}">${c.lastScore ?? '—'}</div><div class="small">${fmtDate(c.lastDate)} · ${escapeHtml(c.lastProp||'')}</div></td>
    </tr>`;
  });
  if (!cleaners.length) html += '<tr><td colspan="5" class="small" style="text-align:center;padding:24px">Sin inspecciones en últimos 60 días</td></tr>';
  html += `</tbody></table></div>`;

  html += `<div class="row-grid">
    <div class="card">
      <h2>Últimos 7 días</h2>
      ${recent.length ? recent.map(r => `
        <div class="feed-item"><div class="feed-flex">
          <span><span class="small" style="margin-right:6px">${fmtDate(r.service_date)}</span>${escapeHtml(r.cleaner_name)} · ${escapeHtml(r.property_name||'')}</span>
          <span class="${scoreClass(r.score)}">${r.score ?? '—'}</span>
        </div></div>`).join('') : '<div class="small" style="padding:8px 0">Sin inspecciones en últimos 7 días</div>'}
    </div>
    <div class="card">
      <h2>Propiedades con catches (30d)</h2>
      ${props.length ? props.map(p => `
        <div class="feed-item"><div class="feed-flex">
          <span>${escapeHtml(p.name)}</span>
          <span class="small">${p.count} catch${p.count===1?'':'es'}</span>
        </div><div class="small">${p.sevs.slice(0,3).map(s => `${s.sev} ${fmtDate(s.date)}`).join(' · ')}</div></div>`).join('') : '<div class="small" style="padding:8px 0">Sin catches en últimos 30 días</div>'}
    </div>
  </div>`;

  // === SCORECARD ===
  // Customer (25) = (BK avg ÷ 5) × 25, baseline 20
  // Internal QC (50) = (Jenny avg ÷ 5) × 50, fallback BK proxy, else 40
  // Issues 60d (25) = max(0, 25 - penalty), penalty = S1×10 + S2×5 + S3×2.5 + S4×1.25
  // BK Customer Rating events EXCLUDED from issues bucket (already in Customer)
  const allCleaners = new Set([...Object.keys(byCleaner), ...Object.keys(window.__bkPerCleaner || {})]);
  const scorecard = [];
  allCleaners.forEach(name => {
    if (!name) return;
    if (!CLEANER_ROSTER.has(name)) return;
    const events = (byCleaner[name]?.events) || [];
    const eventsExcludingBK = events.filter(e => (e.raw_data?.source || '').toLowerCase() !== 'bk customer rating');
    const sevC = { S1:0, S2:0, S3:0, S4:0 };
    eventsExcludingBK.forEach(e => { if (sevC[e.severity] !== undefined) sevC[e.severity]++; });
    const penalty = sevC.S1*10 + sevC.S2*5 + sevC.S3*2.5 + sevC.S4*1.25;
    const issuesPts = Math.max(0, 25 - penalty);

    const bk = (window.__bkPerCleaner || {})[name];
    const bkAvg = bk?.count > 0 ? bk.sum / bk.count : null;
    const customerPts = bkAvg !== null ? (bkAvg / 5) * 25 : 20;

    const jennyScored = events.filter(e => e.supervisor_name === 'Jenny Guilamo' && e.score !== null);
    let qcPts;
    let qcAvg = null;
    if (jennyScored.length > 0) {
      qcAvg = jennyScored.reduce((s,e) => s + e.score, 0) / jennyScored.length;
      qcPts = (qcAvg / 5) * 50;
    } else if (bkAvg !== null) {
      qcPts = (bkAvg / 5) * 50;
    } else {
      qcPts = 40;
    }

    const total = customerPts + qcPts + issuesPts;
    const eligible = (bkAvg === null || bkAvg >= 4.5) &&
                     (jennyScored.length === 0 || qcAvg >= 4.0) &&
                     sevC.S1 === 0 && sevC.S2 === 0 &&
                     events.length < 3;
    scorecard.push({ name, customerPts, qcPts, issuesPts, total, eligible, bkAvg, bkCount: bk?.count || 0, qcAvg, qcCount: jennyScored.length, sevC });
  });
  scorecard.sort((a,b) => b.total - a.total);

  function totalCls(t) {
    if (t >= 90) return 'sc-90';
    if (t >= 80) return 'sc-80';
    if (t >= 70) return 'sc-70';
    if (t >= 60) return 'sc-60';
    return 'sc-low';
  }

  html += `<div class="card">
    <h2>Scorecard general</h2>
    <p class="small" style="margin:0 0 10px">Score 25 + 50 + 25 = Customer (BK ★) · Internal QC (Jenny ★) · Issues 60d. Eligible = BK ≥ 4.5 · QC ≥ 4.0 · 0 S1/S2 · &lt; 3 eventos en 60d.</p>
    <table>
      <thead><tr>
        <th></th><th>Limpiadora</th>
        <th style="text-align:right">Customer<br><span class="small" style="font-weight:400">(25)</span></th>
        <th style="text-align:right">Jenny QC<br><span class="small" style="font-weight:400">(50)</span></th>
        <th style="text-align:right">Issues 60d<br><span class="small" style="font-weight:400">(25)</span></th>
        <th style="text-align:right">TOTAL</th>
        <th style="text-align:center">Eligible</th>
      </tr></thead>
      <tbody>`;
  scorecard.forEach((s, i) => {
    const datCust = s.bkAvg !== null ? `${s.bkAvg.toFixed(2)}★ (${s.bkCount})` : 'sin data';
    const datQC = s.qcCount > 0 ? `${s.qcAvg.toFixed(1)}★ (${s.qcCount})` : (s.bkAvg !== null ? 'BK proxy' : 'baseline');
    const sevSummary = ['S1','S2','S3','S4'].filter(k => s.sevC[k]).map(k => `${k}×${s.sevC[k]}`).join(' ');
    html += `<tr class="sc-row">
      <td class="sc-rank">${i+1}</td>
      <td>${escapeHtml(s.name)}</td>
      <td style="text-align:right">${s.customerPts.toFixed(1)}<div class="small">${escapeHtml(datCust)}</div></td>
      <td style="text-align:right">${s.qcPts.toFixed(1)}<div class="small">${escapeHtml(datQC)}</div></td>
      <td style="text-align:right">${s.issuesPts.toFixed(1)}<div class="small">${escapeHtml(sevSummary || '—')}</div></td>
      <td style="text-align:right"><span class="sc-total ${totalCls(s.total)}">${s.total.toFixed(1)}</span></td>
      <td style="text-align:center" class="${s.eligible?'sc-elig-y':'sc-elig-n'}">${s.eligible?'✓':'✗'}</td>
    </tr>`;
  });
  html += `</tbody></table>
    <details style="margin-top:10px"><summary>Cómo se calcula</summary>
    <div class="legend">
    <strong>Customer (25)</strong> = BK avg ÷ 5 × 25. Sin BK ratings → baseline 20.<br>
    <strong>Internal QC (50)</strong> = Jenny avg ÷ 5 × 50. Sin Jenny → BK proxy. Sin ninguno → baseline 40.<br>
    <strong>Issues 60d (25)</strong> = max(0, 25 − penalty). Penalty = S1×10 + S2×5 + S3×2.5 + S4×1.25. Eventos derivados de BK ratings <em>excluidos</em> (ya cuentan en Customer).<br>
    <strong>Color total:</strong> ≥90 verde · 80-89 verde claro · 70-79 amarillo · 60-69 naranja · &lt;60 rojo.
    </div></details>
  </div>`;

  // Footer with totals
  html += `<div class="small" style="text-align:center;padding:16px 0">
    Base: ${rows.length} inspecciones cargadas · ${cleaners.length} limpiadoras activas en 60d · ${scorecard.length} en scorecard · datos desde Supabase domo-leads
  </div>`;

  document.getElementById('content').innerHTML = html;
  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = false;
}

load();
</script>
</body>
</html>
